<!DOCTYPE html>
<html>
<head>
    <title>Edit Test Drive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Edit Test Drive Info</h2>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Driver Name</label>
                <input type="text" name="driver_name" class="form-control" value="{{ data.driver_name }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Vehicle ID</label>
                <input type="text" name="vehicle_id" class="form-control" value="{{ data.vehicle_id }}">
            </div>
            <button type="submit" class="btn btn-success">💾 Save Changes</button>
            <a href="/" class="btn btn-secondary ms-2">🔙 Back</a>
        </form>
    </div>
</body>
</html>
