<!DOCTYPE html>
<html>
<head>
    <title>Driver Summary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 class="mb-4">Driver Summary</h2>
    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Driver Name</th>
                <th>Vehicle ID</th>
                <th>Status</th>
                <th>Face Verified</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for row in drivers %}
            <tr>
                <td>{{ row[0] }}</td>
                <td>{{ row[1] }}</td>
                <td>{{ row[2] }}</td>
                <td>{{ row[3] }}</td>
                <td>{{ row[4] }}</td>
                <td><a href="/edit/{{ row[0] }}" class="btn btn-sm btn-primary">Edit</a></td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
