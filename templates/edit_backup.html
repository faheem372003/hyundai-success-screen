<!DOCTYPE html>
<html>
<head>
    <title>Edit Driver</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Edit Driver Info</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Driver Name</label>
            <input type="text" name="driver_name" value="{{ driver[1] }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Vehicle ID</label>
            <input type="text" name="vehicle_id" value="{{ driver[2] }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Status</label>
            <input type="text" name="status" value="{{ driver[3] }}" class="form-control">
        </div>
        <div class="mb-3">
            <label class="form-label">Face Verified</label>
            <input type="text" name="face_id_verified" value="{{ driver[4] }}" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Update</button>
    </form>
</body>
</html>
